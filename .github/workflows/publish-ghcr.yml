name: publish-ghcr

# Build this fork's web + worker images and push them to GHCR, so downstream
# projects can pull them instead of building from source:
#   ghcr.io/rlongdragon/langfuse:live-view
#   ghcr.io/rlongdragon/langfuse-worker:live-view
# (plus a :<sha> tag for pinning). Runs on every push to feat/live-view.

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/live-view"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: web
            image_name: langfuse
            dockerfile: ./web/Dockerfile
          - component: worker
            image_name: langfuse-worker
            dockerfile: ./worker/Dockerfile
    steps:
      - name: Free disk space on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set NEXT_PUBLIC_BUILD_ID
        run: echo "NEXT_PUBLIC_BUILD_ID=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.component }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            NEXT_PUBLIC_BUILD_ID=${{ env.NEXT_PUBLIC_BUILD_ID }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}:live-view
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_name }}
